# Choose command to run to create the environment:
# 1. Create a NEW environment named 'mc4':
#  conda env create -f mc4.yml
# 2. Update an existing 'mc4' environment:
#  conda env update -n mc4 -f mc4.yml
#
name: mc4
channels:
  - conda-forge
  - openeye
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - numba
  - vtk=9.3
  - setuptools>=64
  - pymol-open-source
  - rdkit
  - openeye-toolkits
  - langgraph
  # ftpl agent dependencies from conda-forge:
  - dimorphite-dl
  # other ftpl agent LLM providers (default: gemini)
  #- anthropic
  #- openai
  - pip:
    - scipy
    - requests
    - matplotlib
    - seaborn
    - pandas
    - joblib
    - scikit-learn
    - networkx
    - pytest
    - fastapi[standard]
    - google-genai
    - python-multipart>=0.0.5
    - websockets>=10.0
    - uvicorn[standard]>=0.20.0
