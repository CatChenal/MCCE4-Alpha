# Choose command to run to create the environment:
# 1. Create a NEW environment named 'mc4':
#  conda env create -f mc4.yml
# 2. Update an existing 'mc4' environment:
#  conda env update -n mc4 -f mc4.yml
#
name: mc4
channels:
  - conda-forge
  - openeye
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytest
  - numpy
  - scipy
  - requests
  - pytest
  - matplotlib
  - pandas
  - networkx            # interaction_graph.py
  - scikit-learn        # ml_pbs.py
  - openeye-toolkits    # pbs_interfaces.py, agent, clis
  - pymol-open-source   # ms_dipole.py, agent, clis
  - fastapi[standard]   # agent
  - vtk=9.3             # vmd_interface
  - pymol-open-source   # agent
  - rdkit               # agent
  - langgraph           # agent
  - dimorphite-dl       # agent
  # other ftpl agent LLM providers (default: gemini)
  #- anthropic
  #- openai
  - pip:
    - google-genai               # agent
